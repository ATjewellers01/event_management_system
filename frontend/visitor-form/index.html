<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitor Form | Event Hub</title>
    <link rel="icon" type="image/png" href="/assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); }
        .input-field { width: 100%; background: #f1f5f9; border: 1.5px solid transparent; border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 500; color: #0f172a; transition: all 0.2s; outline: none; box-sizing: border-box; }
        .input-field:focus { background: #ffffff; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .input-label { display: block; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 16px; width: 100%; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25); text-align: center; display: block; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: none; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .result-view { display: none; }
        .form-view { display: block; }
        
        /* Loading Overlay */
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .loader-overlay.active { opacity: 1; pointer-events: all; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 15px !important; }
            #formHeader { margin-bottom: 20px !important; }
            #orgCompany { font-size: 20px !important; }
            .p-6 { padding: 16px !important; }
            .pt-14 { padding-top: 45px !important; }
            .btn-primary { font-size: 14px !important; padding: 14px !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md">
        
        <!-- Header -->
        <div id="formHeader" class="text-center mb-8">
            <div id="eventIcon" class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-inner">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            </div>
            <h1 id="eventName" class="text-2xl font-black text-gray-900 mb-1 leading-tight">Loading...</h1>
            <p id="eventSubtitle" class="text-gray-500 font-medium text-sm"></p>
        </div>

        <!-- REGISTRATION FORM -->
        <div id="formView" class="glass-card p-6 md:p-8 form-view animate-fade-in">
            <form id="visitorForm" class="space-y-5">
                <div>
                    <label class="input-label">Mobile No. <span class="text-red-500">*</span></label>
                    <input type="tel" id="v_mobile" class="input-field" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit mobile number" required>
                </div>
                <div>
                    <label class="input-label">Company Name</label>
                    <input type="text" id="v_company" class="input-field">
                </div>
                <div>
                    <label class="input-label">Customer Name</label>
                    <input type="text" id="v_name" class="input-field">
                </div>
                <div>
                    <label class="input-label">Pincode</label>
                    <input type="text" id="v_pincode" class="input-field" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" title="Enter a 6-digit pincode">
                    <p id="v_pincode_status" class="text-xs text-gray-400 mt-1"></p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="input-label">State</label>
                        <input type="text" id="v_state" class="input-field">
                    </div>
                    <div>
                        <label class="input-label">City</label>
                        <input type="text" id="v_city" class="input-field">
                    </div>
                </div>
                <div>
                    <label class="input-label">Address</label>
                    <input type="text" id="v_address" class="input-field">
                </div>
                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="btn-primary">Submit Details</button>
                </div>
            </form>

            <!-- Scan a business card to fill the form instead of typing it -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-center text-xs text-gray-400 font-semibold uppercase tracking-widest mb-1">
                    Business Card <span id="cardReqLabel" class="text-red-500">*</span>
                </p>
                <p id="cardReqHint" class="text-center text-[11px] text-gray-500 mb-4 leading-snug">
                    Attach your card, or fill in the details above instead.
                </p>

                <div class="grid grid-cols-2 gap-3">
                    <!-- Front -->
                    <div>
                        <button type="button" id="frontBtn" data-side="front"
                                class="card-slot w-full aspect-[1.6/1] flex flex-col items-center justify-center gap-1.5 rounded-2xl border-2 border-dashed border-blue-300 bg-blue-50 text-blue-700 font-bold hover:bg-blue-100 transition-colors overflow-hidden relative">
                            <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <span class="text-[12px] leading-none">Front <span class="text-red-500">*</span></span>
                        </button>
                    </div>
                    <!-- Back (optional) -->
                    <div>
                        <button type="button" id="backBtn" data-side="back"
                                class="card-slot w-full aspect-[1.6/1] flex flex-col items-center justify-center gap-1.5 rounded-2xl border-2 border-dashed border-gray-300 bg-gray-50 text-gray-500 font-bold hover:bg-gray-100 transition-colors overflow-hidden relative">
                            <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span class="text-[12px] leading-none">Back <span class="font-medium opacity-70">(optional)</span></span>
                        </button>
                    </div>
                </div>

                <button type="button" id="readCardBtn" disabled
                        class="w-full mt-3 flex items-center justify-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Read Card &amp; Fill Form
                </button>

                <!-- capture prompts the camera on a phone, and still allows a file on desktop -->
                <input type="file" id="frontFileInput" accept="image/*" capture="environment" class="hidden">
                <input type="file" id="backFileInput" accept="image/*" capture="environment" class="hidden">
                <p id="scanStatus" class="text-center text-[12px] font-semibold mt-3 hidden"></p>
            </div>
        </div>

        <!-- SUCCESS & CONTACT VIEW -->
        <div id="resultView" class="result-view animate-fade-in pb-10">
            <!-- Digital Business Card -->
            <div class="glass-card overflow-hidden">
                <!-- Cover Area -->
                <div class="h-28 bg-gradient-to-br from-blue-600 to-indigo-800 relative">
                    <div id="logoContainer" class="absolute -bottom-10 left-6 w-20 h-20 bg-white rounded-2xl shadow-lg border-4 border-white flex items-center justify-center text-blue-600 overflow-hidden">
                        <svg id="defaultLogo" class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                </div>
                
                <div class="p-6 pt-14">
                    <h2 id="orgCompany" class="text-2xl font-black text-gray-900 mb-3 leading-tight">--</h2>

                    <!-- Registration confirmation -->
                    <div class="flex items-start gap-3 mb-6 p-4 bg-emerald-50 border border-emerald-100 rounded-2xl">
                        <svg class="w-5 h-5 text-emerald-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <div>
                            <p class="font-black text-emerald-900 text-[15px] leading-tight">Thank you for registering!</p>
                            <p id="thanksEvent" class="text-emerald-700 text-[13px] font-medium mt-0.5 leading-snug"></p>
                        </div>
                    </div>

                    <div class="space-y-4 mb-8">
                        <div id="rowAddress" class="flex items-start gap-4 hidden">
                            <div class="w-9 h-9 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <div class="pt-0.5">
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Location</p>
                                <p id="valAddress" class="text-[14px] font-semibold text-gray-900 leading-snug"></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Social Links -->
                    <div id="socialLinks" class="flex gap-3 mb-8 justify-start hidden">
                         <a id="linkLi" href="#" target="_blank" class="w-10 h-10 rounded-full bg-[#E1F0FF] text-[#0077b5] flex items-center justify-center hidden hover:scale-110 transition-transform"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
                         <a id="linkTw" href="#" target="_blank" class="w-10 h-10 rounded-full bg-[#E1F2FB] text-[#1DA1F2] flex items-center justify-center hidden hover:scale-110 transition-transform"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg></a>
                         <a id="linkFb" href="#" target="_blank" class="w-10 h-10 rounded-full bg-[#E2EAFD] text-[#1877F2] flex items-center justify-center hidden hover:scale-110 transition-transform"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
                         <a id="linkIg" href="#" target="_blank" class="w-10 h-10 rounded-full bg-[#FCE6F1] text-[#E4405F] flex items-center justify-center hidden hover:scale-110 transition-transform"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg></a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
        <div class="spinner mb-4"></div>
        <p class="text-blue-600 font-bold text-sm uppercase tracking-widest" id="loaderText">Processing...</p>
    </div>

    <script>
        // Extract EventId from URL Path
        // Expected format: /visitor-form/{eventId}
        const pathParts = window.location.pathname.split('/');
        const eventId = pathParts[pathParts.length - 1];
        let eventDataCache = null;
        let currentEventName = '';

        // Pincode -> City/State autofill via api.postalpincode.in (free, no key).
        // City/State stay editable always — a miss or network failure just
        // falls back to manual entry, it never blocks the form.
        function wirePincodeAutofill(pincodeId, cityId, stateId, statusId) {
            const pinInput = document.getElementById(pincodeId);
            const cityInput = document.getElementById(cityId);
            const stateInput = document.getElementById(stateId);
            const statusEl = statusId ? document.getElementById(statusId) : null;
            if (!pinInput) return;

            let lastRequestId = 0;

            pinInput.addEventListener('input', async () => {
                const pin = pinInput.value.trim();
                const requestId = ++lastRequestId;
                const isStale = () => requestId !== lastRequestId;

                if (!/^\d{6}$/.test(pin)) {
                    if (statusEl) statusEl.textContent = '';
                    return;
                }

                if (statusEl) statusEl.textContent = 'Looking up…';
                try {
                    const r = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                    const data = await r.json();
                    if (isStale()) return;

                    const result = Array.isArray(data) ? data[0] : null;
                    if (result && result.Status === 'Success' && result.PostOffice && result.PostOffice.length) {
                        const po = result.PostOffice[0];
                        if (cityInput) cityInput.value = po.District || cityInput.value;
                        if (stateInput) stateInput.value = po.State || stateInput.value;
                        if (statusEl) statusEl.textContent = '';
                    } else {
                        if (statusEl) statusEl.textContent = 'PIN not found — enter city/state manually';
                    }
                } catch (e) {
                    if (isStale()) return;
                    if (statusEl) statusEl.textContent = 'PIN not found — enter city/state manually';
                }
            });
        }

        // --- Scan a business card to prefill the form ---------------------------

        // Phone cameras produce 4-8MB JPEGs. Full resolution buys the OCR nothing
        // beyond ~1600px on the long edge and makes the upload painfully slow on
        // booth wifi, so downscale before sending.
        function fileToScaledDataUrl(file, maxEdge = 1600) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Could not read the image file.'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('That file is not a readable image.'));
                    img.onload = () => {
                        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
                        const w = Math.round(img.width * scale);
                        const h = Math.round(img.height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        // JPEG, not WebP: gpt-4o vision accepts it everywhere and
                        // Safari's WebP encoder support is patchy on older iOS.
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Only fill blanks — never clobber something the visitor already typed.
        function fillIfEmpty(id, value) {
            if (!value) return false;
            const el = document.getElementById(id);
            if (!el || el.value.trim()) return false;
            el.value = String(value).trim();
            return true;
        }

        // Cards usually list several numbers in one string ("+91 98765 43210,
        // 0731-2456789"). Split on the separators first and test each candidate on
        // its own — stripping every non-digit and scanning the joined result finds
        // a 10-digit run that straddles two different numbers, which yields a
        // plausible-looking but completely wrong mobile.
        function pickMobile(phoneStr) {
            if (!phoneStr) return '';
            for (const partRaw of String(phoneStr).split(/[,;/|]| or /i)) {
                // A "Tel"/"Ph"/"Off"/"Fax" label means this segment is a landline.
                // Skipping it beats trying to rescue digits from it: an Indore
                // landline (0731-2456789) becomes 7312456789 once the leading 0 is
                // dropped, which passes any 10-digit mobile test and would be saved
                // as a mobile number that cannot be called.
                if (/\b(tel|ph|phone|off|office|fax|landline)\b/i.test(partRaw)) continue;

                let dg = partRaw.replace(/[^\d]/g, '');

                // Strip a +91 country code, which is unambiguous at these lengths.
                if (dg.length === 12 && dg.startsWith('91')) dg = dg.slice(2);
                else if (dg.length === 13 && dg.startsWith('091')) dg = dg.slice(3);
                else if (dg.length === 11 && dg.startsWith('0')) dg = dg.slice(1);

                // Indian mobiles are exactly 10 digits starting 6-9. An unlabelled
                // landline written bare (0731-2456789 -> 11 digits) still slips
                // through here, so the visitor is told to check the details; mobile
                // is the one field they are certain to look at.
                if (/^[6-9]\d{9}$/.test(dg)) return dg;
            }
            return '';
        }

        // The card gives a free-text "location" ("Indore, Madhya Pradesh") rather
        // than separate fields, and carries no pincode at all. Split on the last
        // comma: the tail is the state, the head the city.
        function applyCardLocation(location) {
            if (!location) return false;
            const parts = String(location).split(',').map(s => s.trim()).filter(Boolean);
            if (!parts.length) return false;
            let filled = false;
            if (parts.length === 1) {
                filled = fillIfEmpty('v_city', parts[0]) || filled;
            } else {
                filled = fillIfEmpty('v_state', parts[parts.length - 1]) || filled;
                filled = fillIfEmpty('v_city', parts.slice(0, -1).join(', ')) || filled;
            }
            return filled;
        }

        // Scaled data URLs for each side. Module scope because both the card block
        // and the submit handler need them: the images are sent with the form.
        const captured = { front: null, back: null };

        // The detail fields. A lead needs more than a bare phone number to be worth
        // anything, so the form demands either these or a card photo.
        const DETAIL_FIELDS = ['v_company', 'v_name', 'v_pincode', 'v_city', 'v_state', 'v_address'];

        function hasTypedDetails() {
            return DETAIL_FIELDS.some(id => {
                const el = document.getElementById(id);
                return el && el.value.trim();
            });
        }

        // Card is required only while no details have been typed; once any detail is
        // filled it becomes optional, and vice versa. Keeps the asterisk, the hint
        // and the submit gate showing the same rule.
        function refreshCardRequirement() {
            const detailsGiven = hasTypedDetails();
            const cardGiven = !!captured.front;
            const star = document.getElementById('cardReqLabel');
            const hint = document.getElementById('cardReqHint');
            if (!star || !hint) return;

            if (detailsGiven) {
                star.classList.add('hidden');
                hint.textContent = cardGiven
                    ? 'Card attached — it will be saved with your details.'
                    : 'Optional — you have filled in your details.';
                hint.className = 'text-center text-[11px] text-gray-400 mb-4 leading-snug';
            } else {
                star.classList.remove('hidden');
                hint.textContent = cardGiven
                    ? 'Card attached. Tap Read Card to fill the form, or just submit.'
                    : 'Required unless you fill in the details above.';
                hint.className = 'text-center text-[11px] text-gray-500 mb-4 leading-snug';
            }
        }

        function wireCardScan() {
            const status = document.getElementById('scanStatus');
            const readBtn = document.getElementById('readCardBtn');
            if (!readBtn) return;

            const say = (msg, cls) => {
                status.textContent = msg;
                status.className = 'text-center text-[12px] font-semibold mt-3 ' + cls;
            };

            // Show the captured photo in the slot so the visitor can see whether it
            // is readable — and retake it by tapping again — before spending a scan.
            function showThumb(side, dataUrl, label) {
                const slot = document.getElementById(side + 'Btn');
                slot.innerHTML =
                    '<img src="' + dataUrl + '" alt="" class="absolute inset-0 w-full h-full object-cover">' +
                    '<span class="absolute inset-0 bg-black/35"></span>' +
                    '<span class="relative text-white text-[11px] font-bold drop-shadow">' + label + ' ✓</span>' +
                    '<span class="relative text-white/80 text-[9px] font-semibold drop-shadow">tap to retake</span>';
                slot.classList.remove('border-dashed');
                slot.classList.add('border-solid', 'border-blue-500');
            }

            function wireSlot(side, label) {
                const btn = document.getElementById(side + 'Btn');
                const input = document.getElementById(side + 'FileInput');
                if (!btn || !input) return;

                btn.addEventListener('click', () => input.click());

                input.addEventListener('change', async () => {
                    const file = input.files && input.files[0];
                    // Reset immediately so retaking the same file still fires 'change'.
                    input.value = '';
                    if (!file) return;
                    try {
                        captured[side] = await fileToScaledDataUrl(file);
                        showThumb(side, captured[side], label);
                        // Front is what the reader needs; back alone is not enough.
                        readBtn.disabled = !captured.front;
                        refreshCardRequirement();
                        say(captured.front
                            ? (captured.back ? 'Front and back ready — tap Read Card.' : 'Front ready — add the back, or tap Read Card.')
                            : 'Add the front of the card to continue.', 'text-blue-600');
                    } catch (err) {
                        console.error(err);
                        say('That photo could not be used — please try again.', 'text-amber-600');
                    }
                });
            }

            wireSlot('front', 'Front');
            wireSlot('back', 'Back');

            readBtn.addEventListener('click', async () => {
                if (!captured.front) return;

                readBtn.disabled = true;
                say('Reading your card…', 'text-blue-600');

                try {
                    const body = { base64Image1: captured.front };
                    // Only send the back when there is one; the endpoint treats it as
                    // optional and a null would just be extra payload.
                    if (captured.back) body.base64Image2 = captured.back;

                    const res = await fetch('/ocr-extract', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const out = await res.json();
                    const d = (out && out.data) || {};

                    if (!out.success) {
                        say('Could not read that card — please fill the form manually.', 'text-amber-600');
                        return;
                    }

                    // The OCR returns "Not Found" for misses; treat that as empty.
                    const clean = (v) => {
                        const s = (v == null ? '' : String(v)).trim();
                        return (!s || /^not found$/i.test(s)) ? '' : s;
                    };

                    let n = 0;
                    if (fillIfEmpty('v_company', clean(d.company))) n++;
                    if (fillIfEmpty('v_name', clean(d.name))) n++;
                    if (fillIfEmpty('v_address', clean(d.address))) n++;
                    if (applyCardLocation(clean(d.location))) n++;

                    const mob = pickMobile(clean(d.phone));
                    if (mob && fillIfEmpty('v_mobile', mob)) n++;

                    if (n) {
                        say('Card read — please check the details and edit anything that looks wrong.', 'text-emerald-600');
                        refreshCardRequirement();
                        document.getElementById('v_mobile').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        say('Nothing new found on that card — please fill the form manually.', 'text-amber-600');
                    }
                } catch (err) {
                    console.error(err);
                    say('Could not read that card — please fill the form manually.', 'text-amber-600');
                } finally {
                    readBtn.disabled = !captured.front;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("EventID from URL:", eventId);
            if (!eventId || eventId === 'visitor-form') {
                document.getElementById('eventName').innerText = "Invalid Event Link";
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            wirePincodeAutofill('v_pincode', 'v_city', 'v_state', 'v_pincode_status');
            wireCardScan();

            // Keep the card's required/optional state in step with what is typed.
            DETAIL_FIELDS.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', refreshCardRequirement);
            });
            refreshCardRequirement();

            // Fetch the event name to change the intro text
            try {
                const r = await fetch(`/get-event/${eventId}`);
                const resData = await r.json();
                if (resData.success && resData.data) {
                    const evName = resData.data['Event Name'];
                    currentEventName = evName || '';
                    document.getElementById('eventName').innerText = `Thank you for visiting ${evName}!`;
                    document.getElementById('eventSubtitle').innerText = "Please share your details to connect.";
                } else {
                    document.getElementById('eventName').innerText = "Thank you for visiting!";
                    document.getElementById('eventSubtitle').innerText = "Please share your details to connect.";
                }
            } catch (e) {
                document.getElementById('eventName').innerText = "Thank you for visiting!";
                document.getElementById('eventSubtitle').innerText = "Please share your details to connect.";
            }
        });

        document.getElementById('visitorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            // Mobile is the only required field, so it is the one thing worth
            // checking before we show the loader.
            const mobile = document.getElementById('v_mobile').value.trim();
            if (!/^\d{10}$/.test(mobile)) {
                alert('Please enter a 10-digit mobile number.');
                document.getElementById('v_mobile').focus();
                return;
            }

            // A mobile number on its own is not a usable lead. Accept it only when
            // something identifies the person: either typed details, or a card
            // photo we keep so the details can be read off it later.
            if (!hasTypedDetails() && !captured.front) {
                alert('Please either fill in your details, or attach a photo of your business card.');
                document.getElementById('frontBtn').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            btn.disabled = true;
            loader.classList.add('active');

            if (!eventId || eventId === 'visitor-form') {
                alert('Invalid event link. Please use the correct QR code or link.');
                btn.disabled = false;
                loader.classList.remove('active');
                return;
            }

            const payload = {
                eventId: eventId,
                source: 'QR',
                companyName: document.getElementById('v_company').value,
                customerName: document.getElementById('v_name').value,
                pincode: document.getElementById('v_pincode').value,
                state: document.getElementById('v_state').value,
                city: document.getElementById('v_city').value,
                address: document.getElementById('v_address').value,
                mobileNo: document.getElementById('v_mobile').value
            };

            // Send any card photo along with the details. When the visitor gave
            // only a number, this image is the sole record of who they are, so it
            // has to be stored rather than just read.
            if (captured.front) {
                payload.cardImage1 = captured.front;
                if (captured.back) payload.cardImage2 = captured.back;
            }

            console.log('Submitting visitor data:', payload);

            // Tracks whether the server confirmed the write, so a later rendering
            // error is never reported to the visitor as a failed submission.
            let saved = false;

            try {
                // Submit Visitor Data & Fetch Event Contact Info in one call
                const response = await fetch('/submit-visitor-and-get-contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const res = await response.json();
                
                if (res.success && res.contactInfo) {
                    saved = true;
                    eventDataCache = res.contactInfo;
                    
                    // Populate the confirmation view. Only the company name, the
                    // thank-you line and the location are shown — the visitor has just
                    // handed over their details, so the company's own phone/email/site
                    // are not what they need at this moment.
                    const c = res.contactInfo;
                    document.getElementById('orgCompany').innerText = c.company || 'Event Contact';

                    const fullAddr = [c.address, c.city, c.state, c.country].filter(Boolean).join(', ');
                    if (fullAddr) { 
                        const addrEl = document.getElementById('valAddress');
                        if (c.mapsLink) {
                            addrEl.innerHTML = `<a href="${c.mapsLink}" target="_blank" class="hover:underline text-blue-600">${fullAddr}</a>`;
                        } else {
                            addrEl.innerText = fullAddr;
                        }
                        document.getElementById('rowAddress').classList.remove('hidden'); 
                    }
                    
                    // Logo handle
                    if (c.logoBase64 && c.logoBase64.startsWith('data:image')) {
                        const lCont = document.getElementById('logoContainer');
                        if (lCont) {
                            lCont.innerHTML = `<img src="${c.logoBase64}" class="w-full h-full object-contain" alt="Logo">`;
                        }
                    }

                    let hasSocial = false;
                    if (c.linkedin) { document.getElementById('linkLi').href = c.linkedin; document.getElementById('linkLi').classList.remove('hidden'); hasSocial = true; }
                    if (c.twitter) { document.getElementById('linkTw').href = c.twitter; document.getElementById('linkTw').classList.remove('hidden'); hasSocial = true; }
                    if (c.facebook) { document.getElementById('linkFb').href = c.facebook; document.getElementById('linkFb').classList.remove('hidden'); hasSocial = true; }
                    if (c.instagram) { document.getElementById('linkIg').href = c.instagram; document.getElementById('linkIg').classList.remove('hidden'); hasSocial = true; }
                    if (hasSocial) document.getElementById('socialLinks').classList.remove('hidden');
                    
                    // Confirmation line, naming the event where we know it.
                    const evLabel = (eventDataCache && eventDataCache.eventName) || currentEventName;
                    document.getElementById('thanksEvent').innerText = evLabel
                        ? `Your details have been recorded for ${evLabel}.`
                        : 'Your details have been recorded.';

                    // Swap Views
                    document.getElementById('formView').style.display = 'none';
                    if (document.getElementById('formHeader')) document.getElementById('formHeader').style.display = 'none';

                    // Scroll to top upon success
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    document.getElementById('resultView').style.display = 'block';
                } else {
                    alert(res.message || 'Failed to submit details. Please try again.');
                }
            } catch (err) {
                console.error(err);
                // `saved` is set the moment the server confirms the write. If we get
                // here after that, the save succeeded and something in the rendering
                // below it threw — reporting that as a network error is wrong and
                // makes people submit again, creating duplicates.
                if (saved) {
                    alert('Your details were saved successfully. (The confirmation screen could not be displayed.)');
                } else {
                    // Surface the real reason: on a phone there is no console to read,
                    // and "network error" hides genuine causes like a blocked request
                    // or a JSON parse failure.
                    alert('Could not submit.\n\n' + (err && err.name ? err.name + ': ' : '') +
                          (err && err.message ? err.message : String(err)));
                }
            } finally {
                btn.disabled = false;
                loader.classList.remove('active');
            }
        });
    </script>
</body>
